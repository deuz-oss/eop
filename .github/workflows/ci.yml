name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    env:
      # Service containers are reachable from the runner at localhost, not
      # the docker-compose-internal "postgres" hostname the app's own
      # default settings.database_url points at.
      DATABASE_URL: postgresql+asyncpg://eop:eop@localhost:5432/eop

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eop
          POSTGRES_USER: eop
          POSTGRES_PASSWORD: eop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eop -d eop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Alembic downgrade -1
        run: uv run alembic downgrade -1

      - name: Alembic upgrade head (re-apply)
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest
