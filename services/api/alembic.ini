# Alembic configuration for the EOP API service.
#
# The database URL is intentionally left blank here. It is set at runtime
# in alembic/env.py from eop_api.core.config.settings (DATABASE_URL env var),
# so the application and migrations always share one source of truth.

[alembic]
# path to migration scripts, relative to this file
script_location = alembic

# template used to generate migration file names, prefixed with a
# timestamp so revisions sort chronologically on disk
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename. Left blank (localtime) since the tzdata
# package required for named zones is not installed by default on Windows.
# timezone =

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
revision_environment = false

# version location specification; defaults to <script_location>/versions
version_locations = %(here)s/alembic/versions

# path_separator; use os.pathsep to split lists of file paths
path_separator = os

# the output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# database URL. Consumed by env.py, which overrides it at runtime from
# eop_api.core.config.settings.
sqlalchemy.url =


[post_write_hooks]
# format and lint newly generated revision scripts so they match the
# project's ruff configuration
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
