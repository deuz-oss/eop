[project]
name = "eop-api"
version = "0.1.0"
description = "Enterprise Operations Platform API"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "sqlalchemy>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "redis>=6.2.0",
    "greenlet>=3.2.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "structlog>=25.4.0",
    "httpx>=0.28.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
    "mypy>=1.17.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]
ignore = []
fixable = ["ALL"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
strict = false

[tool.hatch.build.targets.wheel]
packages = ["src/eop_api"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md"
]
