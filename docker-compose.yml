services:
  postgres:
    image: postgres:17

    container_name: eop-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: eop
      POSTGRES_USER: eop
      POSTGRES_PASSWORD: eop

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eop -d eop"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine

    container_name: eop-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    command:
      - redis-server

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z

    container_name: eop-minio

    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api

    container_name: eop-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      minio:
        condition: service_healthy

    environment:
      APP_NAME: Enterprise Operations Platform

      ENVIRONMENT: development

      DATABASE_URL: postgresql+asyncpg://eop:eop@postgres:5432/eop

      REDIS_URL: redis://redis:6379/0

      MINIO_ENDPOINT: minio:9000

      MINIO_ACCESS_KEY: minioadmin

      MINIO_SECRET_KEY: minioadmin

      MINIO_SECURE: "false"

      MINIO_BUCKET: eop-files

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  minio_data:
